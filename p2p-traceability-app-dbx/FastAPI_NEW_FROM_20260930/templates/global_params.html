<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traceability APP - Global Parameters</title>
  <link rel="stylesheet" href="/static/common.css">
</head>
<body>
<div class="container">
  <header>
    <img src="/static/logo.png" alt="Essity logo"
         style="position:absolute;left:40px;top:50%;transform:translateY(-50%);height:60px;background:white;padding:8px 12px;border-radius:8px;">
    <h1>Traceability APP</h1>
    <p>Global Query Parameters</p>
  </header>

  <div class="page-nav-wrap">
    <div class="page-nav">
      <a href="/" class="nav-home active">⚙ Global Parameters</a>
      <a href="/converting">Converting</a>
      <a href="/tab1">TAB1</a>
      <a href="/tab2">TAB2</a>
      <a href="/tab3">TAB3</a>
    </div>
  </div>

  <div class="table-section">
    <div id="sections"></div>

    <div class="filter-actions">
      <button id="runBtn" class="btn btn-primary" type="button">Run Query</button>
      <button id="stopBtn" class="btn btn-danger" type="button" disabled>Stop query</button>
      <button id="clearBtn" class="btn btn-secondary" type="button">Clear All</button>
    </div>

    <!-- Keep one global status line here.
         Per-report SQL/mandatory errors are shown on /converting under each report. -->
    <div id="runStatus" class="status" style="margin-top:12px;"></div>
  </div>
</div>

<script src="/static/common.js"></script>
<script>
  /*
    Global Parameters page controller.

    Purpose
    -------
    - Render all global parameter sections defined in common.js (SECTIONS)
    - Collect values and start a new backend run (run_id)
    - Preload first-page caches for Converting reports
    - Keep UI simple and centralized for future tabs/reports

    Important maintenance notes
    ---------------------------
    - Add/edit fields in static/common.js (SECTIONS), not directly in this file.
    - Add SQL/filter behavior in params.py.
    - This page should not contain report-specific SQL logic.
  */

  const controls = {};
  let generation = 0;
  let running = false;

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function multiControl(field, target) {
    let values = [];

    const box = element('div', 'chip-box');
    const input = element('input');
    input.type = 'text';
    input.placeholder = 'Enter values separated by commas';
    box.appendChild(input);
    target.appendChild(box);

    function draw() {
      box.querySelectorAll('.chip').forEach(chip => chip.remove());

      values.forEach(value => {
        const chip = element('span', 'chip', value);
        const remove = element('button', 'chip-x', '×');
        remove.type = 'button';
        remove.onclick = () => {
          values = values.filter(v => v !== value);
          draw();
        };
        chip.appendChild(remove);
        box.insertBefore(chip, input);
      });
    }

    function commit() {
      input.value
        .split(/[,;\n]/)
        .map(s => s.trim())
        .filter(Boolean)
        .forEach(value => {
          if (!values.includes(value)) values.push(value);
        });

      input.value = '';
      draw();
    }

    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        commit();
      }
      if (event.key === 'Backspace' && !input.value && values.length) {
        values.pop();
        draw();
      }
    });

    input.addEventListener('blur', commit);
    input.addEventListener('input', () => {
      if (/[,;\n]/.test(input.value)) commit();
    });

    controls[field.key] = {
      commit,
      get: () => ({ values: [...values] }),
      set: stored => {
        values = Array.isArray(stored?.values) ? [...stored.values] : [];
        draw();
      },
      reset: () => {
        values = [];
        input.value = '';
        draw();
      },
    };
  }

  function selectControl(field, target) {
    const select = element('select');
    select.appendChild(new Option('Any', ''));
    target.appendChild(select);

    const listeners = [];
    let sequence = 0;
    let restored = null;

    async function load(parentValue, keepRestored) {
      const ticket = ++sequence;
      const query = field.dependsOn && parentValue
        ? `?${field.dependsOn}=${encodeURIComponent(parentValue)}`
        : '';

      try {
        const response = await fetch(field.source + query);
        const data = await response.json();

        if (ticket !== sequence) return;

        select.replaceChildren(new Option('Any', ''));
        (data.values || []).forEach(v => select.appendChild(new Option(v, v)));

        const wanted = keepRestored ? restored : null;
        select.value = wanted && [...select.options].some(o => o.value === wanted) ? wanted : '';
        restored = null;

        if (data.error) console.warn(field.label, data.error);
      } catch (error) {
        console.warn('Could not load', field.label, error);
      }
    }

    select.addEventListener('change', () => {
      listeners.forEach(cb => cb(select.value));
    });

    controls[field.key] = {
      commit: () => {},
      get: () => select.value || null,
      set: value => {
        restored = value || null;
        load(field.dependsOn ? controls[field.dependsOn].get() : null, true);
      },
      reset: () => {
        restored = null;
        select.value = '';
        listeners.forEach(cb => cb(''));
      },
      onChange: cb => listeners.push(cb),
    };

    if (field.dependsOn) controls[field.dependsOn].onChange(value => load(value, false));
    else load(null, false);
  }

  function dateControl(field, target) {
    const input = element('input');
    input.type = 'date';
    target.appendChild(input);

    controls[field.key] = {
      commit: () => {},
      get: () => input.value || null,
      set: value => { input.value = value || ''; },
      reset: () => { input.value = ''; },
    };
  }

  function textControl(field, target) {
    const input = element('input');
    input.type = 'text';
    input.placeholder = field.placeholder || '';
    target.appendChild(input);

    controls[field.key] = {
      commit: () => {},
      get: () => {
        const v = (input.value || '').trim();
        return v || null;
      },
      set: value => { input.value = value || ''; },
      reset: () => { input.value = ''; },
    };
  }

  // Build parameter cards from SECTIONS metadata.
  SECTIONS.forEach(section => {
    const card = element('div', 'report-card');

    const title = element('div', 'report-title');
    title.append(
      element('span', 'report-badge', section.badge),
      element('h2', '', section.title)
    );
    card.appendChild(title);

    if (section.description) {
      card.appendChild(element('p', 'section-description', section.description));
    }

    const grid = element('div', 'param-grid');

    section.fields.forEach(field => {
      const cell = element('div', 'param-cell');
      if (field.newRow) cell.style.gridColumnStart = '1';

      const control = element('div', 'param-ctl');

      if (field.type === 'multi') multiControl(field, control);
      else if (field.type === 'select') selectControl(field, control);
      else if (field.type === 'date') dateControl(field, control);
      else if (field.type === 'text') textControl(field, control);

      cell.append(
        element('label', 'param-label', field.label),
        control
      );
      grid.appendChild(cell);
    });

    card.appendChild(grid);
    document.getElementById('sections').appendChild(card);
  });

  function collect() {
    const result = {};
    SECTIONS.forEach(section => section.fields.forEach(field => {
      controls[field.key].commit();
      result[field.key] = controls[field.key].get();
    }));
    return result;
  }

  async function restore(params) {
    if (!params) return;

    // Set plant first so dependent production lines load correctly.
    if (controls.plant_id) await controls.plant_id.set(params.plant_id);
    if (controls.production_line) controls.production_line.set(params.production_line);

    SECTIONS.forEach(section => section.fields.forEach(field => {
      if (field.key === 'plant_id' || field.key === 'production_line') return;
      controls[field.key].set(params[field.key]);
    }));
  }

  function setRunning(value) {
    running = value;
    document.getElementById('runBtn').disabled = value;
    document.getElementById('stopBtn').disabled = !value;
  }

  async function runQuery() {
    if (running) return;

    const params = collect();

    if (params.production_date_from && params.production_date_to &&
        params.production_date_from > params.production_date_to) {
      setStatus('runStatus', 'err', 'Production date FROM cannot be after TO.');
      return;
    }

    const ticket = ++generation;
    setRunning(true);
    setStatus('runStatus', 'loading', 'Running reports...');

    try {
      // Stop previous run (best effort)
      const previousRun = getRunId();
      if (previousRun) {
        try { await stopRun(previousRun); } catch (_) {}
      }

      const runId = await startRun();
      if (ticket !== generation) {
        await stopRun(runId);
        return;
      }

      saveGlobalParams(params, runId);

      // Preload first page of each report and cache it.
      await Promise.all(REPORTS.map(async report => {
        const data = await fetchReport(report, params, runId, 10, 0);

        if (ticket !== generation || getRunId() !== runId) return;

        if (data.success) {
          saveReportCache(report.id, {
            runId,
            columns: data.columns,
            rows: data.rows,
            hasMore: data.has_more,
            offset: 0,
            limit: 10,
          });
        } else {
          saveReportCache(report.id, {
            runId,
            error: data.error || 'The report could not be generated.',
            missing: Boolean(data.missing),
            cancelled: Boolean(data.cancelled),
          });
        }
      }));

      if (ticket === generation) {
        setStatus('runStatus', 'ok', 'Parameters applied. Open Converting to see the report results.');
      }
    } catch (error) {
      if (ticket === generation) {
        setStatus('runStatus', 'err', `Error: ${error.message || error}`);
      }
    } finally {
      if (ticket === generation) setRunning(false);
    }
  }

  async function stopQuery() {
    if (!running) return;

    ++generation;
    setRunning(false);

    const runId = getRunId();
    clearReportCaches();
    setStatus('runStatus', 'loading', 'Stopping the queries...');

    try {
      const result = await stopRun(runId);
      if (result?.errors?.length) {
        setStatus(
          'runStatus',
          'err',
          `Stop requested, but some queries could not be cancelled: ${result.errors.join('; ')}`
        );
      } else {
        setStatus('runStatus', 'ok', 'Stop requested. Running queries may take a moment to stop.');
      }
    } catch (error) {
      setStatus('runStatus', 'err', `Could not stop the queries: ${error.message || error}`);
    }
  }

  async function clearAll() {
    ++generation;

    const runId = getRunId();
    if (runId) {
      try { await stopRun(runId); } catch (_) {}
    }

    SECTIONS.forEach(section => section.fields.forEach(field => controls[field.key].reset()));
    clearGlobalParams();

    setRunning(false);
    setStatus('runStatus', 'ok', 'Parameters and results cleared.');
  }

  document.getElementById('runBtn').onclick = runQuery;
  document.getElementById('stopBtn').onclick = stopQuery;
  document.getElementById('clearBtn').onclick = clearAll;

  restore(getGlobalParams());
  setStatus('runStatus', 'ok', 'Set the parameters and click "Run Query".');
</script>
</body>
</html>
