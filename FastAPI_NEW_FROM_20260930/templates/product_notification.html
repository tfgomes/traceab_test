<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traceability APP - Product Notifications</title>
  <style>
    :root {
      --pink: #F50082;
      --navy: #00005A;
      --green: #009A44;
      --green-hover: #009A44;
      --red: #E4002B;
      --border: #E5E7EB;
      --bg: #F8F9FA;
      --card-border: #D8DCE3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: var(--navy);
      min-height: 100vh;
      padding: 20px;
      overflow-y: scroll; /* force scrollbar always */
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    header {
      background: linear-gradient(135deg, #F50082, #FF1A99);
      color: white;
      padding: 30px 40px;
      text-align: center;
      position: relative;
    }
    header h1 { font-size: 2.2rem; margin-bottom: 8px; }
    header p { opacity: 0.9; }

    .page-nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 40px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .page-nav {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
    }
    .page-nav a {
      text-decoration: none;
      color: var(--navy);
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .page-nav a.active {
      background: var(--navy);
      color: #fff;
    }

    .table-section { padding: 20px 40px 40px; }

    .report-card {
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .report-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .report-badge {
      background: var(--navy);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      letter-spacing: 0.2px;
    }

    .report-title h2 {
      font-size: 1.05rem;
      color: var(--navy);
      font-weight: 700;
    }

    /* same behavior as upstream/downstream */
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .filter-item label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 3px;
    }

    .filter-item input {
      width: 100%;
      padding: 6px 10px;
      height: 34px;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      background: white;
    }

    .filter-item input:focus { outline: none; border-color: var(--pink); }

    .filter-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 22px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
    }

    .btn-primary { background: var(--pink); }
    .btn-primary:hover { background: #D4006D; }

    .btn-secondary { background: #6C757D; }
    .btn-secondary:hover { background: #5A6268; }

    .btn-export { background: var(--green); }
    .btn-export:hover { background: var(--green-hover); }

    .status {
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-weight: 600;
      font-size: 0.9rem;
      display: none;
    }
    .status.ok {
      background: #F5F7FF;
      color: #374151;
      border: 1px solid #E5E7EB;
      display: block;
    }
    .status.err { background: var(--red); color: white; display: block; }
    .status.loading { background: #ddd; color: #555; display: block; }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 0;
    }

    table { width: 100%; border-collapse: collapse; background: white; font-size: 0.85rem; }
    thead { background: var(--navy); color: white; }
    th { padding: 13px 16px; text-align: left; white-space: nowrap; }
    td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tr:hover td { background: var(--bg); }
    tr:last-child td { border-bottom: none; }

    .table-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 16px 20px;
      background: var(--bg);
      border-radius: 8px;
      flex-wrap: wrap;
      gap: 10px;
      border: 1px solid var(--card-border);
    }

    .controls-left { display: flex; align-items: center; gap: 16px; }
    .record-count { font-size: 0.9rem; color: #555; }

    .page-size-wrap { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #555; }
    .page-size-wrap select {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      background: white;
    }

    .pagination { display: flex; align-items: center; gap: 10px; }

    .btn-small {
      padding: 6px 16px;
      font-size: 0.85rem;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-small:disabled { opacity: 0.35; cursor: default; }

    .page-info { font-size: 0.85rem; color: #555; min-width: 80px; text-align: center; }

    @media (max-width: 1100px) {
      .filter-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 640px) {
      .filter-grid { grid-template-columns: repeat(2, 1fr); }
      header h1 { font-size: 1.5rem; }
      .table-section { padding: 16px; }
      .report-card { padding: 12px; }
      .page-nav-wrap { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="/static/logo.png" alt="Company Logo"
           style="position:absolute;left:40px;top:50%;transform:translateY(-50%);height:60px;background:rgba(255,255,255,0.95);padding:8px 12px;border-radius:8px;">
      <div>
        <h1>Traceability APP - POC</h1>
        <p>Product Notification</p>
      </div>
    </header>

    <div class="page-nav-wrap">
      <div class="page-nav">
        <a href="/">Global Parameters</a>
        <a href="/converting">Converting</a>
        <a href="/product-notification" class="active">Product Notification</a>
        <a href="/upstream">Upstream tracing</a>
        <a href="/downstream">Downstream tracing</a>
      </div>
    </div>

    <div class="table-section">
      <section id="report3">
        <div class="report-card">
          <div class="report-title">
            <span class="report-badge">PN</span>
            <h2>Product Complaints / Notifications</h2>
          </div>

          <div class="filter-grid">
            <div class="filter-item">
              <label>Plant Id</label>
              <input type="text" id="f3_PlantId" list="l3_PlantId" placeholder="Any">
              <datalist id="l3_PlantId"></datalist>
            </div>
            <div class="filter-item">
              <label>Material Id</label>
              <input type="text" id="f3_MaterialId" list="l3_MaterialId" placeholder="Any">
              <datalist id="l3_MaterialId"></datalist>
            </div>
            <div class="filter-item">
              <label>Notification</label>
              <input type="text" id="f3_Notification" list="l3_Notification" placeholder="Any">
              <datalist id="l3_Notification"></datalist>
            </div>
            <div class="filter-item">
              <label>Notification Date (Start)</label>
              <input type="date" id="f3_NotificationDateStart" min="2026-01-01">
            </div>
            <div class="filter-item">
              <label>Notification Date (End)</label>
              <input type="date" id="f3_NotificationDateEnd" min="2026-01-01">
            </div>
          </div>

          <div class="filter-actions">
            <button class="btn btn-primary" onclick="runReport(3, true)">Run Query</button>
            <button class="btn btn-secondary" onclick="clearReport3()">Clear All</button>
            <button class="btn btn-export" onclick="exportReport(3)">⬇ Export CSV</button>
          </div>
        </div>

        <div id="status3" class="status ok">Set filters and click "Run Query"</div>
        <div class="table-wrapper">
          <table>
            <thead id="thead3"></thead>
            <tbody id="tbody3"><tr><td style="text-align:center;padding:40px;color:#666;">Click "Run Query" to load data</td></tr></tbody>
          </table>
        </div>
        <div class="table-controls">
          <div class="controls-left">
            <span id="recordCount3" class="record-count">Showing 0 records</span>
            <div class="page-size-wrap">Rows per page:
              <select id="pageSize3" onchange="changePageSize(3)">
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </div>
          </div>
          <div class="pagination">
            <button class="btn-small" id="prevBtn3" onclick="prevPage(3)" disabled>← Previous</button>
            <span id="pageInfo3" class="page-info">Page 1</span>
            <button class="btn-small" id="nextBtn3" onclick="nextPage(3)" disabled>Next →</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const MIN_DATE = '2026-01-01';

    const reports = {
      3: {
        dataUrl: '/api/downstream3/data',
        filterUrl: '/api/downstream3/filter-values',
        exportUrl: '/api/downstream3/export',
        filterMap: {
          PlantId: 'f3_PlantId',
          MaterialId: 'f3_MaterialId',
          Notification: 'f3_Notification',
          NotificationDateStart: 'f3_NotificationDateStart',
          NotificationDateEnd: 'f3_NotificationDateEnd'
        },
        datalistMap: {
          PlantId: 'l3_PlantId',
          MaterialId: 'l3_MaterialId',
          Notification: 'l3_Notification'
        },
        state: { limit: 10, offset: 0, hasMore: false, page: 1 },
        validate: validateDateRangeReport3
      }
    };

    async function safeJsonFetch(url) {
      const res = await fetch(url);
      const ct = res.headers.get('content-type') || '';
      if (!ct.includes('application/json')) {
        const txt = await res.text();
        throw new Error(`Expected JSON from ${url}, got: ${txt.slice(0, 120)}`);
      }
      return res.json();
    }

    function setStatus(reportId, cls, text) {
      const el = document.getElementById(`status${reportId}`);
      el.textContent = text;
      el.className = `status ${cls}`;
    }

    function replaceDatalist(id, values) {
      const dl = document.getElementById(id);
      if (!dl) return;
      const parent = dl.parentNode;
      const newDl = document.createElement('datalist');
      newDl.id = id;
      (values || []).forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        newDl.appendChild(opt);
      });
      parent.replaceChild(newDl, dl);
    }

    function getFilters(reportId) {
      const cfg = reports[reportId];
      const f = {};
      Object.entries(cfg.filterMap).forEach(([apiField, inputId]) => {
        const el = document.getElementById(inputId);
        const v = (el?.value || '').trim();
        if (v) f[apiField] = v;
      });
      return f;
    }

    function buildQuery(reportId, extra) {
      return new URLSearchParams(Object.assign(getFilters(reportId), extra || {})).toString();
    }

    function validateDateRangeReport3() {
      const start = document.getElementById('f3_NotificationDateStart').value;
      const end = document.getElementById('f3_NotificationDateEnd').value;

      if (start && start < MIN_DATE) { alert('Start date cannot be before ' + MIN_DATE); return false; }
      if (end && end < MIN_DATE) { alert('End date cannot be before ' + MIN_DATE); return false; }
      if (start && end && start > end) { alert('Start date cannot be greater than End date'); return false; }
      return true;
    }

    async function loadFilterValues(reportId) {
      const cfg = reports[reportId];
      try {
        const data = await safeJsonFetch(`${cfg.filterUrl}?${buildQuery(reportId)}`);
        Object.entries(cfg.datalistMap).forEach(([apiField, dlId]) => {
          replaceDatalist(dlId, data[apiField] || []);
        });
      } catch (e) {
        console.error(`Report ${reportId} filter values error:`, e);
      }
    }

    function isNumericValue(v) {
      if (v === null || v === undefined || v === '') return false;
      return !Number.isNaN(Number(v));
    }

    function renderTable(reportId, columns, rows) {
      const thead = document.getElementById(`thead${reportId}`);
      const tbody = document.getElementById(`tbody${reportId}`);

      const numericCols = new Set();
      rows.forEach(row => {
        row.forEach((val, idx) => {
          if (isNumericValue(val)) numericCols.add(idx);
        });
      });

      thead.innerHTML = '';
      const hr = document.createElement('tr');
      columns.forEach((col, idx) => {
        const th = document.createElement('th');
        th.textContent = col;
        if (numericCols.has(idx)) th.style.textAlign = 'right';
        hr.appendChild(th);
      });
      thead.appendChild(hr);

      tbody.innerHTML = '';
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="${columns.length}" style="text-align:center;padding:40px;color:#666;">No records found</td></tr>`;
        return;
      }

      rows.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach((val, idx) => {
          const td = document.createElement('td');
          td.textContent = (val !== null && val !== undefined) ? val : '';
          td.title = td.textContent;
          if (numericCols.has(idx)) td.style.textAlign = 'right';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function updatePagingUI(reportId, rowCount) {
      const s = reports[reportId].state;
      const start = rowCount ? s.offset + 1 : 0;
      const end = s.offset + rowCount;

      document.getElementById(`recordCount${reportId}`).textContent = rowCount
        ? `Showing ${start.toLocaleString()} - ${end.toLocaleString()}${s.hasMore ? '+' : ' (end)'}`
        : 'Showing 0 records';

      document.getElementById(`pageInfo${reportId}`).textContent = `Page ${s.page}`;
      document.getElementById(`prevBtn${reportId}`).disabled = s.offset === 0;
      document.getElementById(`nextBtn${reportId}`).disabled = !s.hasMore;
    }

    async function loadData(reportId, newOffset = 0) {
      const cfg = reports[reportId];
      const s = cfg.state;
      s.offset = newOffset;

      setStatus(reportId, 'loading', 'Loading...');

      try {
        const data = await safeJsonFetch(`${cfg.dataUrl}?${buildQuery(reportId, { limit: s.limit, offset: s.offset })}`);
        if (!data.success) {
          setStatus(reportId, 'err', `Error: ${data.error}`);
          return;
        }

        s.hasMore = data.has_more;
        s.page = Math.floor(s.offset / s.limit) + 1;

        const rows = data.rows.length;
        const start = rows ? s.offset + 1 : 0;
        const end = s.offset + rows;

        setStatus(reportId, 'ok', rows ? `Showing records ${start} - ${end}${s.hasMore ? '+' : ''}` : 'No records found');
        renderTable(reportId, data.columns, data.rows);
        updatePagingUI(reportId, rows);

      } catch (e) {
        setStatus(reportId, 'err', `Fetch error: ${e.message}`);
      }
    }

    async function runReport(reportId, refreshFilters = false) {
      const cfg = reports[reportId];
      if (cfg.validate && !cfg.validate()) return;
      if (refreshFilters) await loadFilterValues(reportId);
      await loadData(reportId, 0);
    }

    function exportReport(reportId) {
      const cfg = reports[reportId];
      if (cfg.validate && !cfg.validate()) return;
      window.location.href = `${cfg.exportUrl}?${new URLSearchParams(getFilters(reportId)).toString()}`;
    }

    function changePageSize(reportId) {
      const s = reports[reportId].state;
      s.limit = parseInt(document.getElementById(`pageSize${reportId}`).value, 10);
      s.offset = 0;
      loadData(reportId, 0);
    }

    function prevPage(reportId) {
      const s = reports[reportId].state;
      if (s.offset > 0) loadData(reportId, Math.max(0, s.offset - s.limit));
    }

    function nextPage(reportId) {
      const s = reports[reportId].state;
      if (s.hasMore) loadData(reportId, s.offset + s.limit);
    }

    function clearReport3() {
      document.getElementById('f3_PlantId').value = '';
      document.getElementById('f3_MaterialId').value = '';
      document.getElementById('f3_Notification').value = '';
      document.getElementById('f3_NotificationDateStart').value = '';
      document.getElementById('f3_NotificationDateEnd').value = '';
      setStatus(3, 'ok', 'Set filters and click "Run Query"');
      document.getElementById('tbody3').innerHTML =
        '<tr><td style="text-align:center;padding:40px;color:#666;">Click "Run Query" to load data</td></tr>';
      document.getElementById('thead3').innerHTML = '';
      document.getElementById('recordCount3').textContent = 'Showing 0 records';
      document.getElementById('pageInfo3').textContent = 'Page 1';
      document.getElementById('prevBtn3').disabled = true;
      document.getElementById('nextBtn3').disabled = true;
    }

    ['f3_PlantId','f3_MaterialId','f3_Notification','f3_NotificationDateStart','f3_NotificationDateEnd']
      .forEach(id => document.getElementById(id)?.addEventListener('keypress', e => {
        if (e.key === 'Enter') runReport(3, true);
      }));

    // Initial load: no auto data load
    setStatus(3, 'ok', 'Set filters and click "Run Query"');
  </script>
</body>
</html>
