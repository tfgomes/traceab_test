<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traceability APP - DEV - Converting</title>
  <link rel="stylesheet" href="/static/common.css?v=sprint3-final-1">
  <script src="/static/common.js?v=sprint3-final-1" defer></script>
  <script src="/static/params_panel.js?v=sprint3-final-1" defer></script>
  <script src="/static/report_page.js?v=sprint3-final-1" defer></script>
</head>
<body data-report-profile="cv">
<div class="container">
  <header>
    <img
      src="/static/logo.png"
      alt="Essity logo"
      style="position:absolute;left:40px;top:50%;transform:translateY(-50%);height:60px;background:white;padding:8px 12px;border-radius:8px;"
    >
    <div class="app-version">Version: Sprint 3</div>
    <h1>Traceability APP – DEV</h1>
    <p>Converting</p>
  </header>

  <nav class="page-nav-wrap" aria-label="Main navigation">
    <div class="page-nav">
      <a href="/" class="nav-home">⚙ Global Parameters</a>
      <a href="/papermaking">Papermaking</a>
      <a href="/converting" class="active" aria-current="page">Converting</a>
      <a href="/tab1">TAB1</a>
      <a href="/tab2">TAB2</a>
      <a href="/tab3">TAB3</a>
      <a href="/tab4">TAB4</a>
      <a href="/tab5">TAB5</a>
    </div>
    <div class="sync-toolbar" id="syncToolbar"></div>
  </nav>

  <main class="table-section">
    <div id="pageError" class="status" role="alert"></div>

    <!-- Global Parameters now live inside the report page -->
    <section class="report-card gp-top">
      <div class="gp-card-title">
        <h2 style="color:var(--navy);font-size:1.02rem;">Global Parameters</h2>
        <button id="toggleParams" class="collapse-btn" type="button">Collapse</button>
      </div>

      <div id="paramsPanel">
        <div class="gp-layout">
          <aside class="profile-tabs" id="profileTabs"></aside>
          <div class="profile-content">
            <div id="sections"></div>
          </div>
        </div>
      </div>

      <div class="filter-actions">
        <button id="runBtn" class="btn btn-primary" type="button">Run Query</button>
        <button id="stopBtn" class="btn btn-danger" type="button" disabled>Stop Query</button>
        <button id="clearBtn" class="btn btn-secondary" type="button">Clear All</button>
      </div>

      <div id="lastRunLabel" class="last-run">Last run: -</div>
      <div id="runStatus" class="status" style="margin-top:10px;"></div>
    </section>

    <div id="reports"></div>
  </main>
</div>

<script>
(() => {
  function initWhenReady() {
    if (!window.TraceabilityPhaseB || !window.TraceabilityParamsPanel) return false;

    window.TraceabilityParamsPanel.mount({
      profile: "cv",
      sectionsHostId: "sections",
      tabsHostId: "profileTabs",
      statusId: "runStatus",
      lastRunId: "lastRunLabel",
      syncToolbarId: "syncToolbar",
      runBtnId: "runBtn",
      stopBtnId: "stopBtn",
      clearBtnId: "clearBtn",
      collapseAllBtnId: "toggleParams",
      paramsPanelId: "paramsPanel",
      pageForPreload: window.TraceabilityPhaseB.PAGE_CONVERTING,
    });

    return true;
  }

  if (!initWhenReady()) {
    window.addEventListener("load", initWhenReady, { once: true });
  }
})();
</script>
</body>
</html>
